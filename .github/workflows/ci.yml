name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Tests (offline, no credentials)
        run: pytest -q
      - name: Eval smoke (mock LLM, harness validation)
        run: oncall eval --llm mock --out eval-report/mock-baseline.md
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: eval-report
          path: eval-report/

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t gcp-oncall-agent:ci .
